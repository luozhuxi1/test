name: Hugging Face AI Assistant

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  hf-ai:
    if: |
      startsWith(github.event.comment.body, '@ai') ||
      startsWith(github.event.comment.body, '/ai') ||
      contains(github.event.issue?.body || '', '@ai')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue data
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment?.body || context.payload.issue?.body || '';
            const issueNum = context.payload.issue?.number || context.payload.issue_comment?.issue?.number;
            console.log('Issue:', issueNum, 'Body:', body);
            return { body, issueNum };

      - name: Call Hugging Face API
        id: hf
        uses: actions/github-script@v7
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          script: |
            const userMsg = context.payload.comment?.body || context.payload.issue?.body || '';
            const prompt = userMsg.replace(/^[@\/]ai\s*/, '');

            const response = await fetch('https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.HF_TOKEN}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                inputs: `[INST] ${prompt} [/INST]`,
                parameters: { max_new_tokens: 500, temperature: 0.7 }
              })
            });

            const result = await response.json();
            let reply = '🤖 AI 回复：\n\n';
            if (result[0]?.generated_text) {
              reply += result[0].generated_text;
            } else if (result.error) {
              reply += `错误：${result.error}`;
            } else {
              reply += JSON.stringify(result, null, 2);
            }
            return reply;

      - name: Post reply
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNum = context.payload.issue?.number || context.payload.issue_comment?.issue?.number;
            const reply = `${{ steps.hf.outputs.result }}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
              body: reply
            });
